<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BCBC Map V3 — Local Zoning + Parcel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, sans-serif; }

    :root {
      --bg: #f0f2f7; --surface: #fff; --card: #f6f8fc; --border: #dde2ee;
      --text: #1c1f2e; --sub: #6070a0; --accent: #1458cc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0c12; --surface: #121620; --card: #191e2c; --border: #252d44;
        --text: #dde2f4; --sub: #6878a8; --accent: #5090f8;
      }
    }

    body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); }

    /* ── Top bar ── */
    .topbar {
      flex-shrink: 0; height: 44px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 16px; gap: 12px;
    }
    .topbar-title { font-size: 13px; font-weight: 700; color: var(--accent); }
    .topbar-hint  { font-size: 11px; color: var(--sub); flex: 1; }
    .topbar-badge {
      font-size: 10px; padding: 2px 8px; border-radius: 10px;
      background: #dcfce7; color: #166534; font-weight: 600;
    }

    /* ── Layout ── */
    .main { flex: 1; display: flex; min-height: 0; }
    #map  { flex: 1; min-width: 0; cursor: crosshair; }

    /* ── Side panel ── */
    .panel {
      width: 300px; flex-shrink: 0;
      background: var(--surface); border-left: 1px solid var(--border);
      overflow-y: auto; display: flex; flex-direction: column;
    }
    .psec { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .slabel {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--accent); margin-bottom: 8px;
    }

    /* ── States ── */
    .empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px; padding: 32px 16px; text-align: center; color: var(--sub);
    }
    .empty-icon { font-size: 32px; }
    .empty-text { font-size: 12px; line-height: 1.6; }
    .loading { padding: 16px; text-align: center; font-size: 12px; color: var(--accent); }
    .errbox  { margin: 12px; padding: 10px; background: #fee2e2; color: #7f1d1d;
               border-radius: 4px; font-size: 11px; line-height: 1.5; }

    /* ── Address ── */
    .addr    { font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .addrsub { font-size: 11px; color: var(--sub); }

    /* ── Cells ── */
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .cell  { background: var(--card); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; }
    .cell-label { font-size: 9px; text-transform: uppercase; letter-spacing: .07em; color: var(--sub); margin-bottom: 1px; }
    .cell-value { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }

    /* ── Zoning badge ── */
    .zbadge {
      display: inline-block; padding: 4px 10px; border-radius: 4px;
      font-size: 14px; font-weight: 800; letter-spacing: .04em;
      background: #dbeafe; color: #1e40af; margin-bottom: 6px;
    }
    .zrow { font-size: 11px; color: var(--sub); line-height: 1.7; }
    .zrow span { color: var(--text); font-weight: 600; }

    /* ── Dims ── */
    .dim-row { display: flex; gap: 6px; margin-top: 6px; }
    .dim-cell {
      flex: 1; background: var(--card); border: 1px solid var(--border);
      border-radius: 4px; padding: 7px; text-align: center;
    }
    .dim-lbl  { font-size: 9px; text-transform: uppercase; letter-spacing: .07em; color: var(--sub); }
    .dim-val  { font-size: 16px; font-weight: 700; color: var(--accent); }
    .dim-unit { font-size: 9px; color: var(--sub); }

    /* ── Copy button ── */
    .copybtn {
      display: block; width: 100%; padding: 9px;
      background: var(--accent); color: #fff; border: none; border-radius: 5px;
      font-size: 12px; font-weight: 700; cursor: pointer; letter-spacing: .04em;
    }
    .copybtn:hover { opacity: .85; }
    .note { font-size: 9.5px; color: var(--sub); line-height: 1.5; margin-top: 6px; }

    /* ── Legend ── */
    .legend {
      position: absolute; bottom: 28px; left: 10px; z-index: 800;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.15);
      font-size: 11px;
    }
    .legend-title { font-weight: 700; font-size: 10px; color: var(--sub);
                    text-transform: uppercase; letter-spacing: .07em; margin-bottom: 5px; }
    .legend-row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .legend-swatch { width: 14px; height: 14px; border-radius: 2px; flex-shrink: 0; }

    /* ── Loading overlay ── */
    #loadOverlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(10,12,20,.7);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; color: #fff; font-size: 14px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,.2);
      border-top-color: #5090f8;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      .main { flex-direction: column; }
      .panel { width: 100%; border-left: none; border-top: 1px solid var(--border); max-height: 45vh; }
      #map { min-height: 50vh; }
      .legend { bottom: auto; top: 54px; }
    }
  </style>
</head>
<body>

<!-- Loading overlay (shown while GeoJSON loads) -->
<div id="loadOverlay">
  <div class="spinner"></div>
  <div id="loadMsg">Loading Vancouver Zoning data…</div>
</div>

<div class="topbar">
  <span class="topbar-title">BCBC Map V3</span>
  <span class="topbar-hint">Click a parcel to get its boundary, zoning, and dimensions</span>
  <span class="topbar-badge" id="zoningBadge">Zoning: loading…</span>
</div>

<div class="main">
  <div id="map"></div>
  <aside class="panel" id="panel">
    <div class="empty">
      <div class="empty-icon">🗺</div>
      <div class="empty-text">Click anywhere on the map to select a parcel.<br><br>
        Zoning overlay is loaded locally — no API key needed.<br>
        Parcel boundary fetched from Vancouver Open Data.</div>
    </div>
  </aside>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// CONFIGURATION — adjust path if your folder structure differs
// ═══════════════════════════════════════════════════════════
const ZONING_GEOJSON_PATH = 'vancouver_zoning_wgs84.geojson';

const PARCEL_URL =
  'https://services.arcgis.com/V6ZHFr6zdgNZuVG0/ArcGIS/rest/services/' +
  'Vancouver_property_parcel_polygons/FeatureServer/0/query';

// ═══════════════════════════════════════════════════════════
// ZONING COLOUR SCHEME
// Full classification breakdown from the actual dataset
// ═══════════════════════════════════════════════════════════
const ZONE_STYLE = {
  // Residential
  'RS':  { fill: '#86efac', label: 'Single Family (RS)' },
  'RT':  { fill: '#34d399', label: 'Two Family (RT)' },
  'RM':  { fill: '#6ee7b7', label: 'Multiple Dwelling (RM)' },
  'R1':  { fill: '#a7f3d0', label: 'Residential Inclusive (R1)' },
  'R3':  { fill: '#bbf7d0', label: 'Residential (R3)' },
  'R4':  { fill: '#d1fae5', label: 'Residential (R4)' },
  'R5':  { fill: '#ecfdf5', label: 'Residential (R5)' },
  'RR':  { fill: '#6ee7b7', label: 'Residential Rental (RR)' },
  'RA':  { fill: '#d1fae5', label: 'Residential Agriculture (RA)' },
  // Commercial
  'C':   { fill: '#93c5fd', label: 'Commercial (C)' },
  'FC':  { fill: '#60a5fa', label: 'FC District' },
  'MC':  { fill: '#7dd3fc', label: 'MC District' },
  'DD':  { fill: '#38bdf8', label: 'Downtown District (DD)' },
  'CWD': { fill: '#0ea5e9', label: 'CWD' },
  // Industrial
  'I':   { fill: '#fca5a5', label: 'Industrial (I)' },
  'M':   { fill: '#f87171', label: 'Industrial (M)' },
  'IC':  { fill: '#fcd34d', label: 'Industrial-Commercial (IC)' },
  'FM':  { fill: '#fb923c', label: 'FM District' },
  // Comprehensive Development
  'CD':  { fill: '#d8b4fe', label: 'Comprehensive Dev (CD)' },
  // Other
  'HA':  { fill: '#fde68a', label: 'Historical Area (HA)' },
  'FSD': { fill: '#e2e8f0', label: 'FSD' },
  'BCPED': { fill: '#c7d2fe', label: 'BCPED' },
  'FCCDD': { fill: '#a5b4fc', label: 'FCCDD' },
  'DEOD':  { fill: '#e2e8f0', label: 'DEOD' },
};

function getZoneStyle(district) {
  if (!district) return { fill: '#e2e8f0', label: 'Unknown' };
  for (const [prefix, style] of Object.entries(ZONE_STYLE)) {
    if (district.startsWith(prefix)) return style;
  }
  return { fill: '#e2e8f0', label: district };
}

// ═══════════════════════════════════════════════════════════
// MAP INIT
// ═══════════════════════════════════════════════════════════
const map = L.map('map', { center: [49.2527, -123.1207], zoom: 13 });

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors',
  maxZoom: 21,
}).addTo(map);

// ═══════════════════════════════════════════════════════════
// ZONING LAYER (local GeoJSON)
// ═══════════════════════════════════════════════════════════
let zoningGeoJSON = null;   // raw FeatureCollection, kept for point-in-poly lookup
let zoningMapLayer = null;  // Leaflet layer on map
let parcelLayer = null;
let clickDot = null;
let lastData = null;

// Point-in-polygon test (ray casting)
function pointInPolygon(lng, lat, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    const intersect = ((yi > lat) !== (yj > lat)) &&
      (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function findZoneAt(lng, lat) {
  if (!zoningGeoJSON) return null;
  for (const feat of zoningGeoJSON.features) {
    const coords = feat.geometry.coordinates;
    // Outer ring only for speed (holes are rare in zoning polygons)
    if (pointInPolygon(lng, lat, coords[0])) return feat;
  }
  return null;
}

// Load local zoning GeoJSON
fetch(ZONING_GEOJSON_PATH)
  .then(r => {
    if (!r.ok) throw new Error(`Cannot load ${ZONING_GEOJSON_PATH} (HTTP ${r.status})`);
    return r.json();
  })
  .then(data => {
    zoningGeoJSON = data;

    // Render zoning polygons as colour-coded overlay
    zoningMapLayer = L.geoJSON(data, {
      style: feat => {
        const dis = feat.properties.zoning_district || '';
        const s = getZoneStyle(dis);
        return {
          color: 'rgba(0,0,0,0.15)', weight: 0.5,
          fillColor: s.fill, fillOpacity: 0.35,
        };
      },
      onEachFeature: (feat, layer) => {
        const p = feat.properties;
        layer.bindTooltip(
          `<strong>${p.zoning_district || '—'}</strong><br>${p.zoning_classification || ''}`,
          { sticky: true, className: 'zone-tip' }
        );
      },
    }).addTo(map);

    // Hide loading overlay
    document.getElementById('loadOverlay').style.display = 'none';
    document.getElementById('zoningBadge').textContent =
      `Zoning: ${data.features.length} districts loaded ✓`;
  })
  .catch(err => {
    document.getElementById('loadOverlay').style.display = 'none';
    document.getElementById('zoningBadge').textContent = 'Zoning: load failed';
    document.getElementById('zoningBadge').style.background = '#fee2e2';
    document.getElementById('zoningBadge').style.color = '#7f1d1d';
    console.error('Zoning GeoJSON error:', err);
    panel.innerHTML = `<div class="errbox">
      ⚠ Could not load zoning file.<br><br>
      Make sure <code>${ZONING_GEOJSON_PATH}</code> is in the same folder as this HTML file.<br><br>
      Parcel lookup will still work — zoning info will show "—".
    </div>`;
  });

// ═══════════════════════════════════════════════════════════
// LEGEND
// ═══════════════════════════════════════════════════════════
const legendGroups = [
  { fill: '#86efac', label: 'Residential (RS/RT/RM)' },
  { fill: '#a7f3d0', label: 'Residential Inclusive (R1)' },
  { fill: '#6ee7b7', label: 'Rental (RR)' },
  { fill: '#93c5fd', label: 'Commercial (C/DD/FC)' },
  { fill: '#fca5a5', label: 'Industrial (I/M)' },
  { fill: '#fcd34d', label: 'Industrial-Commercial (IC)' },
  { fill: '#d8b4fe', label: 'Comprehensive Dev (CD)' },
  { fill: '#fde68a', label: 'Historical Area (HA)' },
];

const legendEl = document.createElement('div');
legendEl.className = 'legend';
legendEl.innerHTML = `
  <div class="legend-title">Zoning</div>
  ${legendGroups.map(g => `
    <div class="legend-row">
      <div class="legend-swatch" style="background:${g.fill}"></div>
      <span>${g.label}</span>
    </div>`).join('')}
`;
map.getContainer().appendChild(legendEl);

// ═══════════════════════════════════════════════════════════
// GEOMETRY HELPERS
// ═══════════════════════════════════════════════════════════
const LAT_M = 111320;
const lngM  = (d, lat) => d * LAT_M * Math.cos(lat * Math.PI / 180);
const latM  = d => d * LAT_M;

function axialBBox(coords) {
  const ring = coords[0];
  let x0=Infinity, x1=-Infinity, y0=Infinity, y1=-Infinity;
  for (const [lng, lat] of ring) {
    if (lng < x0) x0 = lng; if (lng > x1) x1 = lng;
    if (lat < y0) y0 = lat; if (lat > y1) y1 = lat;
  }
  const midLat = (y0 + y1) / 2;
  return {
    widthM: Math.round(lngM(x1 - x0, midLat)),
    depthM: Math.round(latM(y1 - y0)),
  };
}

function orientedBBox(coords) {
  const ring = coords[0];
  const midLat = ring.reduce((s, p) => s + p[1], 0) / ring.length;
  const pts = ring.map(([lng, lat]) => [lngM(lng, midLat), latM(lat)]);
  const cx = pts.reduce((s, p) => s + p[0], 0) / pts.length;
  const cy = pts.reduce((s, p) => s + p[1], 0) / pts.length;
  const c  = pts.map(p => [p[0]-cx, p[1]-cy]);
  const n  = c.length;
  const cxx = c.reduce((s,p)=>s+p[0]*p[0],0)/n;
  const cyy = c.reduce((s,p)=>s+p[1]*p[1],0)/n;
  const cxy = c.reduce((s,p)=>s+p[0]*p[1],0)/n;
  const ang = 0.5 * Math.atan2(2*cxy, cxx-cyy);
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const us = c.map(p =>  p[0]*ca + p[1]*sa);
  const vs = c.map(p => -p[0]*sa + p[1]*ca);
  return {
    longM:    Math.round(Math.max(Math.max(...us)-Math.min(...us), Math.max(...vs)-Math.min(...vs))),
    shortM:   Math.round(Math.min(Math.max(...us)-Math.min(...us), Math.max(...vs)-Math.min(...vs))),
    angleDeg: (((ang*180/Math.PI)%180)+180)%180,
  };
}

// ═══════════════════════════════════════════════════════════
// PANEL
// ═══════════════════════════════════════════════════════════
const panel = document.getElementById('panel');

function showLoading() {
  panel.innerHTML = `<div class="loading">⏳ Fetching parcel boundary…</div>`;
}
function showError(msg) {
  panel.innerHTML = `<div class="errbox">⚠ ${msg}</div>`;
}

function showResult(parcel, zoneFeat) {
  const pp = parcel.properties;
  const addr = `${pp.CIVIC_NO || ''} ${pp.STREETNAME || ''}`.trim() || 'Unknown address';
  const bbox   = axialBBox(parcel.geometry.coordinates);
  const obb    = orientedBBox(parcel.geometry.coordinates);
  const areaM2 = pp.Shape__Area   ? Math.round(pp.Shape__Area)   : null;
  const perimM = pp.Shape__Length ? Math.round(pp.Shape__Length) : null;

  // Zoning from local lookup
  const zDis = zoneFeat?.properties?.zoning_district       || '—';
  const zCat = zoneFeat?.properties?.zoning_category       || '—';
  const zCla = zoneFeat?.properties?.zoning_classification || '—';
  const zStyle = getZoneStyle(zDis);

  lastData = { addr, bbox, obb, areaM2, zDis, zCat, zCla, taxCoord: pp.TAX_COORD };

  panel.innerHTML = `
    <div class="psec">
      <div class="slabel">Selected Parcel</div>
      <div class="addr">${addr}</div>
      <div class="addrsub">Tax Coord: ${pp.TAX_COORD||'—'} · Site ID: ${pp.SITE_ID||'—'}</div>
    </div>

    <div class="psec">
      <div class="slabel">Zoning District</div>
      <div class="zbadge" style="background:${zStyle.fill}20; color:inherit">${zDis}</div>
      <div class="zrow">Category: <span>${zCat}</span></div>
      <div class="zrow">Classification: <span>${zCla}</span></div>
    </div>

    <div class="psec">
      <div class="slabel">Parcel Size</div>
      <div class="grid2">
        <div class="cell">
          <div class="cell-label">Area</div>
          <div class="cell-value">${areaM2 !== null ? areaM2 + ' m²' : '—'}</div>
        </div>
        <div class="cell">
          <div class="cell-label">Perimeter</div>
          <div class="cell-value">${perimM !== null ? perimM + ' m' : '—'}</div>
        </div>
      </div>
    </div>

    <div class="psec">
      <div class="slabel">Dimensions → V04 Inputs</div>
      <div class="dim-row">
        <div class="dim-cell">
          <div class="dim-lbl">Parcel Width E–W</div>
          <div class="dim-val">${bbox.widthM}</div>
          <div class="dim-unit">metres</div>
        </div>
        <div class="dim-cell">
          <div class="dim-lbl">Parcel Depth N–S</div>
          <div class="dim-val">${bbox.depthM}</div>
          <div class="dim-unit">metres</div>
        </div>
      </div>
      <div class="note" style="margin-top:8px">
        Oriented fit: ${obb.longM} × ${obb.shortM} m @ ${obb.angleDeg.toFixed(0)}° from East.<br>
        Use axis-aligned for standard N–S lots; oriented for diagonal parcels.
      </div>
    </div>

    <div class="psec">
      <button class="copybtn" onclick="copyParams()">📋  Copy Params for V04</button>
      <div class="note">Copies width/depth, area and zoning to clipboard.</div>
    </div>
  `;
}

function copyParams() {
  if (!lastData) return;
  const { addr, bbox, obb, areaM2, zDis, zCat, zCla } = lastData;
  const text = [
    `BCBC V04 Parcel Params — ${addr}`,
    ``,
    `Parcel Width E–W : ${bbox.widthM} m`,
    `Parcel Depth N–S : ${bbox.depthM} m`,
    `Area             : ${areaM2} m²`,
    ``,
    `Zoning District  : ${zDis}`,
    `Zoning Category  : ${zCat}`,
    `Classification   : ${zCla}`,
    ``,
    `(Oriented bbox   : ${obb.longM} × ${obb.shortM} m @ ${obb.angleDeg.toFixed(0)}°)`,
  ].join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = panel.querySelector('.copybtn');
    if (btn) {
      btn.textContent = '✓  Copied!';
      setTimeout(() => { btn.textContent = '📋  Copy Params for V04'; }, 2000);
    }
  });
}

// ═══════════════════════════════════════════════════════════
// PARCEL API
// ═══════════════════════════════════════════════════════════
async function fetchParcel(lat, lng) {
  const p = new URLSearchParams({
    geometry: `${lng},${lat}`,
    geometryType: 'esriGeometryPoint',
    inSR: '4326',
    spatialRel: 'esriSpatialRelIntersects',
    outFields: '*',
    returnGeometry: 'true',
    f: 'geojson',
  });
  const r = await fetch(`${PARCEL_URL}?${p}`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// ═══════════════════════════════════════════════════════════
// MAP CLICK
// ═══════════════════════════════════════════════════════════
let highlightLayer = null;   // highlight ring for clicked zoning polygon

map.on('click', async ({ latlng: { lat, lng } }) => {
  // Clear previous selections
  [parcelLayer, clickDot, highlightLayer].forEach(l => l && map.removeLayer(l));
  parcelLayer = clickDot = highlightLayer = null;

  // Click dot
  clickDot = L.circleMarker([lat, lng], {
    radius: 5, color: '#1458cc', fillColor: '#1458cc', fillOpacity: .9, weight: 2,
  }).addTo(map);

  showLoading();

  try {
    // 1. Local zoning lookup (instant, no network)
    const zoneFeat = findZoneAt(lng, lat);

    // Highlight clicked zoning zone
    if (zoneFeat) {
      const zDis = zoneFeat.properties.zoning_district || '';
      highlightLayer = L.geoJSON(zoneFeat, {
        style: {
          color: '#1458cc', weight: 2, dashArray: '5 4',
          fillColor: getZoneStyle(zDis).fill, fillOpacity: 0.45,
        },
      }).addTo(map);
    }

    // 2. Parcel API (network)
    const parcelGJ = await fetchParcel(lat, lng);

    if (!parcelGJ.features?.length) {
      showError('No parcel found at this location. Try clicking on a residential or commercial lot.');
      return;
    }

    const parcel = parcelGJ.features[0];

    // Draw parcel outline on top of zoning
    parcelLayer = L.geoJSON(parcel, {
      style: {
        color: '#1458cc', weight: 2.5,
        fillColor: '#5090f8', fillOpacity: 0.25,
      },
    }).addTo(map);

    map.fitBounds(parcelLayer.getBounds(), { padding: [60, 60], maxZoom: 19 });

    showResult(parcel, zoneFeat);

  } catch (err) {
    showError(`API error: ${err.message}`);
  }
});
</script>
